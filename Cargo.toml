[workspace]
members = [
    "jessica-core",
    "jessica-runtime",
    "jessica-sandbox",
    "jessica-harness",
    "jessica-providers",
    "jessica-tools",
    "jessica-memory",
    "jessica-cli",
]
resolver = "2"

# 第三方依赖版本集中管理，成员 crate 通过 `dep.workspace = true` 继承。
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
