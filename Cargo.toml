[workspace]
members = [
    "jessica-core",
    "jessica-runtime",
    "jessica-sandbox",
    "jessica-harness",
    "jessica-providers",
    "jessica-tools",
    "jessica-memory",
    "jessica-cli",
]
resolver = "2"

# 第三方依赖版本集中管理，成员 crate 通过 `dep.workspace = true` 继承。
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
# Task 1.1: OpenAI-compatible provider needs a streaming HTTP client.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Task 1.2: AgentLoop accepts a CancellationToken for cooperative cancellation.
tokio-util = { version = "0.7", features = ["rt"] }
# Task 2.4: the CLI reads its harness assembly (budgets, policy,
# sensor, acceptance check) from an explicit TOML file.
toml = "0.9"
# Task 3.1/3.2: jessica-sandbox compiles and runs untrusted wasm modules with
# wasmtime. Default features stay disabled; WASI is added below and only behind
# the explicit capability policy introduced in Task 3.2.
wasmtime = { version = "50.0", default-features = false, features = ["cranelift", "runtime", "std"] }
# Task 3.2: WASI preview 1 host calls for the sandbox. The `p1` feature pulls in
# wasmtime-wasi's preview 2 implementation and therefore enables wasmtime's
# `component-model` and `async` features; this is required by wasmtime-wasi
# itself, not a capability granted to guest modules.
wasmtime-wasi = { version = "50.0", default-features = false, features = ["p1"] }
# Task 4.1: jessica-memory persists the append-only agent event log in SQLite.
# `bundled` compiles the SQLite amalgamation so builds do not depend on a
# system libsqlite3 or its development headers.
rusqlite = { version = "0.41", features = ["bundled"] }
# Task 5.1.3 (user-approved): workspace scopes are the first 16 hex characters
# of sha256(canonical workspace path). This is the only new third-party crate
# approved for the layered-memory work.
sha2 = "0.10"
