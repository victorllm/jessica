[workspace]
members = [
    "jessica-core",
    "jessica-runtime",
    "jessica-sandbox",
    "jessica-harness",
    "jessica-providers",
    "jessica-tools",
    "jessica-memory",
    "jessica-cli",
]
resolver = "2"

# 第三方依赖版本集中管理，成员 crate 通过 `dep.workspace = true` 继承。
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
# Task 1.1: OpenAI-compatible provider needs a streaming HTTP client.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Task 1.2: AgentLoop accepts a CancellationToken for cooperative cancellation.
tokio-util = { version = "0.7", features = ["rt"] }
