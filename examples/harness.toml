# Jessica governed CLI example.
#
# Run from the workspace root:
#
#   cargo run -p jessica-cli --bin jessica -- --config examples/harness.toml \
#     "修改 examples/typo.md 中的拼写错误并验证"
#
# The tool policy intentionally omits `bash`: it is absent from the provider
# tool schema, and an attempted call returns an `unknown tool` error result.
#
# The acceptance command intentionally fails until examples/typo.md contains the
# correct spelling. The first model attempt can therefore fail acceptance and
# force a feedback-driven retry.

[budget]
# Prompt plus completion tokens across all attempts in this turn.
max_tokens = 20_000
# Wall-clock limit applied by the CLI tool wrapper.
tool_timeout_ms = 10_000
# Structural model-round limit enforced by AgentLoop.
max_rounds = 12
# Harness stuck-detection guard threshold.
max_stuck_rounds = 3
# Maximum size of one tool result.
max_result_bytes = 65_536

[policy]
allowed_tools = ["read_file", "write_file"]

# Native bash is disabled by default. To opt in, add this table and keep
# "bash" in policy.allowed_tools; the profile must also permit it.
#
# [tools.bash]
# enabled = true
# sandbox = "process"

# Command-backed tools, the sensor, and the acceptance check run with a cleared
# environment. Only these names are passed through in addition to the built-in
# defaults (PATH, HOME, LANG, TERM, TMPDIR). Provider keys and JESSICA_*
# variables are never inherited.
[tools.supervisor]
env_allowlist = []
command_timeout_ms = 10_000
max_output_bytes = 65_536
sensor_timeout_ms = 10_000
acceptance_timeout_ms = 10_000

[sensor]
name = "diff-check"
command = "git"
args = ["diff", "--check"]

[acceptance]
name = "fixture-spelling"
command = "sh"
args = [
  "-c",
  "grep -q 'deterministic Rust agent runtime' examples/typo.md || { echo 'examples/typo.md still contains the misspelled word; expected phrase: deterministic Rust agent runtime'; exit 1; }",
]
max_retries = 2
