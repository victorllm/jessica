[package]
name = "jessica-cli"
version.workspace = true
edition = "2024"

# Task 7.0b: the installed command is `jessica`. The package name stays
# `jessica-cli` so existing `-p jessica-cli` build/test commands keep working.
[[bin]]
name = "jessica"
path = "src/main.rs"

[dependencies]
jessica-core = { path = "../jessica-core" }
jessica-runtime = { path = "../jessica-runtime" }
jessica-sandbox = { path = "../jessica-sandbox" }
jessica-harness = { path = "../jessica-harness" }
jessica-providers = { path = "../jessica-providers" }
jessica-tools = { path = "../jessica-tools" }
jessica-memory = { path = "../jessica-memory" }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
agent-client-protocol = { workspace = true }

[dev-dependencies]
# Task 7.4: trace-verification E2E tests need to seed a structurally corrupt
# trace, which the append-only store API intentionally cannot produce.
rusqlite = { workspace = true }
