[package]
name = "jessica-providers"
version.workspace = true
edition = "2024"

[dependencies]
jessica-core = { path = "../jessica-core" }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Task 5.4.1: request and stream-idle timeouts use tokio::time::timeout. No new
# third-party crate: tokio is already a workspace dependency and provides the
# runtime used by reqwest.
tokio = { workspace = true }

[dev-dependencies]
# Task 5.4.1: paused-clock timeout tests. This only adds a tokio feature; tokio
# is already a workspace dependency and is not a new third-party crate.
tokio = { workspace = true, features = ["test-util"] }
